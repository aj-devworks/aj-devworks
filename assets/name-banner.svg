<svg width="700" height="110" viewBox="0 0 700 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#2AF598"/>
      <stop offset="25%" stop-color="#009EFD"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="75%" stop-color="#FFC700"/>
      <stop offset="100%" stop-color="#2AF598"/>
      <animate attributeName="x1" values="0%;-200%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200%;0%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="50%" y="52" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="800" font-size="46" fill="url(#nameGrad)">
    Abdinasir Osman
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>
  <text x="50%" y="90" text-anchor="middle" font-family="'Fira Code', monospace" font-weight="500" font-size="20" fill="url(#nameGrad)" opacity="0.9">
    Full-Stack Developer · AI Builder
    <animate attributeName="opacity" values="0;0.9" dur="1.2s" begin="0.3s" fill="freeze"/>
  </text>
</svg>
